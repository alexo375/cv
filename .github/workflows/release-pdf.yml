name: Compile LaTeX & Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Сборка всех PDF через make all
      - name: Compile LaTeX documents
        uses: xu-cheng/texlive-action@v2
        with:
          scheme: full
          run: |
            apk add --no-cache make bash
            make all

      # Публикация всех скомпилированных PDF в релизы по маске
      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest PDF Build"
          body: |
            Автоматически скомпилированные версии резюме и сопроводительного письма.
            
            Последний коммит: ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false
          files: |
            cv-*.pdf
            letter*.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Копирование всех PDF в каталог GitHub Pages по маске
      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp cv-*.pdf letter*.pdf _site/ 2>/devnull || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
