name: Compile LaTeX & Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Позволяет запускать сборку вручную из интерфейса GitHub

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Сборка через официальный экшен texlive-action
      - name: Compile LaTeX documents
        uses: xu-cheng/texlive-action@v2
        with:
          scheme: full
          run: |
            apk add --no-cache make bash
            make all

      # Публикация/обновление релиза
      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest PDF Build"
          body: |
            Автоматически скомпилированные версии резюме и сопроводительного письма.
            
            Последний коммит: ${{ github.event.head_commit.message }}
            Время сборки: ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: false
          files: |
            cv.pdf
            letter.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
